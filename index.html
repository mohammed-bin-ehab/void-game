<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#010102">
<title>VOID</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=Reem+Kufi:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout: full-bleed WebGL concrete room seen from a low chase camera; HUD pinned to the corners; one centered card for menu / pause / death.
   Single dark look by choice: the game is a lightless room, so no light theme. */
:root {
  --void: #010102;
  --ink: #0b0d12;
  --slate: #1b2030;
  --lantern: #d6b27c;
  --rim: #a9a7c8;
  --fg: #cfd4e2;
  --dim: #8a91a6;
  --display: 'Reem Kufi', 'Segoe UI', Tahoma, sans-serif;
  --body: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  color-scheme: dark;
}
html { box-sizing: border-box; height: 100%; background: var(--void); }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--void); color: var(--fg);
  font-family: var(--body); font-size: 16px; line-height: 1.6;
  -webkit-user-select: none; user-select: none;
}
#stage { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: none; background: var(--void); }
#c { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
.vignette { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.7) 100%); }
.dread { position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0) 18%, rgba(0,0,0,0.92) 78%); }

#hud { position: absolute; inset: 0; pointer-events: none; direction: ltr; }
#hud[hidden] { display: none; }
.hl { position: absolute; left: 24px; top: 20px; display: grid; gap: 0; text-align: left; }
.lbl { font-size: 15px; color: var(--dim); }
.lbl small { font-size: 12px; opacity: 0.8; }
#time { font: 600 32px/1.2 var(--body); letter-spacing: 0.02em; color: #f1f1f4; font-variant-numeric: tabular-nums; }
#best { font: 600 28px/1.2 var(--body); color: var(--lantern); font-variant-numeric: tabular-nums; margin-top: 0; }
.hl .lbl + #best { margin-top: 0; }
.hl #time + .lbl { margin-top: 10px; }
.hr { position: absolute; right: 20px; top: 18px; display: flex; align-items: center; gap: 12px; }
.dashbox { display: grid; gap: 6px; justify-items: end; }
.segs { display: flex; gap: 6px; direction: rtl; }
.segs i { width: 24px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.18); transition: background 0.12s; }
.segs i.on { background: #e8e2d4; }
.bolt { width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid rgba(214,178,124,0.7); display: grid; place-items: center; color: var(--lantern); }
.bolt svg { width: 20px; height: 20px; }
.ghost { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); pointer-events: auto; font: 400 13px var(--body); color: var(--dim); background: transparent; border: 1px solid rgba(122,130,153,0.3); border-radius: 4px; padding: 3px 10px; cursor: pointer; }
.ghost:hover { color: var(--fg); border-color: rgba(207,212,226,0.5); }
.ghost:focus-visible, .btn:focus-visible, .dashbtn:focus-visible, .chip:focus-visible { outline: 2px solid var(--lantern); outline-offset: 3px; }

.hints { position: absolute; inset: auto 24px 24px 24px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; direction: ltr; color: #aab0c0; font-size: 16px; }
.hints[hidden] { display: none; }
.hint-i { display: flex; align-items: center; gap: 12px; opacity: 0.85; }
.hint-i svg { width: 30px; height: 44px; color: #b8b2a2; flex: none; }
@media (pointer: coarse) { .hints { display: none; } }

#panel { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px 16px; overflow-y: auto; background: radial-gradient(ellipse at center, rgba(1,1,2,0.35), rgba(1,1,2,0.88)); }
#panel[hidden] { display: none; }
.card { width: 100%; max-width: 460px; text-align: center; display: grid; gap: 16px; justify-items: center; }
.title { margin: 0; font: 700 clamp(64px, 17vw, 128px)/0.9 var(--display); letter-spacing: 0.32em; padding-inline-start: 0.32em; color: #e8ebf4; text-shadow: 0 0 32px rgba(169,167,200,0.28), 0 0 2px rgba(255,255,255,0.4); }
.title.small { font-size: clamp(44px, 12vw, 76px); }
.sub { margin: 0; font: 500 clamp(20px, 4.5vw, 26px) var(--display); color: var(--lantern); letter-spacing: 0.06em; text-wrap: balance; }
.lede { margin: 0; color: var(--dim); text-wrap: balance; max-width: 36ch; }
.keys { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; font-size: 14px; color: var(--dim); }
.keys b { font-weight: 600; color: var(--fg); }
.chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.chip { font: 600 15px var(--body); color: var(--dim); background: transparent; border: 1px solid rgba(122,130,153,0.35); border-radius: 999px; padding: 4px 18px; cursor: pointer; }
.chip:hover { color: var(--fg); }
.chip.on { color: var(--lantern); border-color: rgba(214,178,124,0.65); background: rgba(214,178,124,0.08); }
.stats { display: flex; gap: 28px; justify-content: center; font-variant-numeric: tabular-nums; }
.stat { display: grid; gap: 0; }
.stat span:first-child { font-size: 12px; color: var(--dim); letter-spacing: 0.06em; }
.stat span:last-child { font: 500 30px var(--display); color: var(--fg); }
.badge { font-size: 13px; color: var(--lantern); border: 1px solid rgba(214,178,124,0.5); border-radius: 999px; padding: 2px 14px; }
.btn { font: 600 18px var(--body); color: var(--lantern); background: rgba(214,178,124,0.06); border: 1px solid rgba(214,178,124,0.55); border-radius: 4px; padding: 10px 34px; cursor: pointer; transition: background 0.2s, box-shadow 0.2s; }
.btn:hover { background: rgba(214,178,124,0.16); box-shadow: 0 0 24px rgba(214,178,124,0.15); }
.hint { font-size: 12px; color: var(--dim); opacity: 0.8; }
.taunt { margin: 0; color: var(--dim); font-size: 15px; }

.dashbtn { display: none; position: absolute; right: 18px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: 84px; height: 84px; border-radius: 50%; place-items: center;
  font: 600 15px var(--body); color: var(--lantern); background: rgba(214,178,124,0.07); border: 1px solid rgba(214,178,124,0.45); touch-action: none; }
@media (pointer: coarse) { .dashbtn.on { display: grid; } }
.joy { position: absolute; width: 104px; height: 104px; border: 1px solid rgba(255,255,255,0.14); border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); }
.joy[hidden] { display: none; }
.joy i { position: absolute; left: 50%; top: 50%; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.1); transform: translate(-50%, -50%); }

input { -webkit-user-select: text; user-select: text; }
.roster { margin-top: 14px; display: grid; gap: 3px; font-size: 14px; direction: rtl; text-align: right; }
.roster[hidden] { display: none; }
.rs { display: flex; align-items: center; gap: 8px; color: #e8ebf4; text-shadow: 0 1px 3px #000; }
.rs.dead { opacity: 0.35; text-decoration: line-through; }
.rs .nb, .nb { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font: 700 12px var(--body); color: #0b0d12; flex: none; }
.mpbar { direction: rtl; position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); font-size: 15px; color: #cfd4e2; background: rgba(0,0,0,0.5); border: 1px solid rgba(207,212,226,0.2); border-radius: 999px; padding: 4px 16px; text-align: center; pointer-events: none; white-space: nowrap; }
.mpbar[hidden], .perks[hidden], .toast[hidden], .countEl[hidden] { display: none; }
.perks { position: absolute; right: 20px; top: 78px; display: grid; gap: 4px; justify-items: end; font-size: 13px; direction: rtl; pointer-events: none; }
.perks span { border: 1px solid rgba(214,178,124,0.55); background: rgba(214,178,124,0.1); color: var(--lantern); border-radius: 999px; padding: 1px 12px; }
.toast { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); font: 600 20px var(--body); color: var(--lantern); text-shadow: 0 2px 8px #000; text-align: center; pointer-events: none; transition: opacity 0.3s; }
.countEl { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font: 700 clamp(64px, 18vw, 140px) var(--display); color: #e8ebf4; text-shadow: 0 0 40px rgba(169,167,200,0.4); pointer-events: none; }
.pushbtn { right: auto; left: 18px; }
@media (pointer: coarse) { .pushbtn.on { display: grid; } .roster { font-size: 12px; } .mpbar { bottom: calc(112px + env(safe-area-inset-bottom, 0px)); } }
.rt { margin: 0; font: 700 32px var(--display); color: #e8ebf4; letter-spacing: 0.08em; }
.field { width: 100%; font: 500 17px var(--body); color: var(--fg); background: rgba(255,255,255,0.05); border: 1px solid rgba(122,130,153,0.4); border-radius: 6px; padding: 9px 14px; text-align: center; direction: rtl; }
.field:focus { outline: 2px solid var(--lantern); outline-offset: 2px; }
.plist { width: 100%; display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; text-align: right; }
.plist li { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border: 1px solid rgba(122,130,153,0.25); border-radius: 8px; background: rgba(255,255,255,0.03); }
.plist .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plist .st { font-size: 13px; color: var(--dim); }
.plist .st.ok { color: #7bd389; }
.err { color: #ff9b8a; font-size: 14px; min-height: 1.4em; margin: 0; }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }
.rank { width: 100%; display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.rank li { display: flex; align-items: center; gap: 10px; padding: 4px 12px; border-radius: 6px; background: rgba(255,255,255,0.03); }
.rank li.w { background: rgba(214,178,124,0.12); border: 1px solid rgba(214,178,124,0.5); }
.rank .nm { flex: 1; text-align: right; }
.rank .tm { color: var(--dim); font-variant-numeric: tabular-nums; }
</style>

<div id="stage">
  <canvas id="c" aria-label="غرفة خرسانية مظلمة ثلاثية الأبعاد فيها شخصية صغيرة وثقب أسود يلاحقها"></canvas>
  <div class="vignette"></div>
  <div class="dread" id="dread"></div>

  <div id="hud" hidden>
    <div class="hl">
      <span class="lbl">الوقت</span>
      <span id="time">00:00</span>
      <span class="lbl" id="bestLbl">أفضل رقم <small id="modeTag"></small></span>
      <span id="best">00:00</span>
      <div id="roster" class="roster" hidden></div>
    </div>
    <button id="mute" class="ghost" type="button">الصوت: تشغيل</button>
    <div class="hr">
      <div class="dashbox">
        <span class="lbl">الاندفاع</span>
        <div class="segs" id="segs"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="bolt"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 2 5 13.2h5.4L9.6 22 19 10.2h-5.6z"/></svg></div>
    </div>
  </div>

  <div id="hints" class="hints" hidden>
    <div class="hint-i">
      <svg viewBox="0 0 28 42" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="2" y="2" width="24" height="38" rx="12"/><path d="M14 2v14"/></svg>
      <span dir="rtl">تحرك بالماوس</span>
    </div>
    <div class="hint-i">
      <span dir="rtl">انقر للاندفاع</span>
      <svg viewBox="0 0 28 42" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="2" y="2" width="24" height="38" rx="12"/><path d="M14 2v14M2 16h24"/><path d="M2 16V14a12 12 0 0 1 12-12v14z" fill="currentColor" opacity="0.5" stroke="none"/></svg>
    </div>
  </div>

  <div id="joy" class="joy" hidden><i id="joyk"></i></div>
  <button id="dashbtn" class="dashbtn" type="button">اندفاع</button>
  <button id="pushbtn" class="dashbtn pushbtn" type="button">دفع</button>
  <div id="mpbar" class="mpbar" hidden></div>
  <div id="perks" class="perks" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <div id="countEl" class="countEl" hidden></div>

  <div id="panel" dir="rtl" lang="ar">
    <div class="card" id="card"></div>
  </div>
</div>

<script>
(() => {
'use strict';

const MP_ENABLED = true;   // the multiplayer build flips this to true

/* ---------- Tuning: every number you may want to change lives here ---------- */
const CFG = {
  playerSpeed: 255,
  playerRadius: 9,
  dashSpeed: 700,
  dashTime: 0.16,
  dashCooldown: 1.4,
  voidRadius: 44,
  lightRadius: 185,
  wallHeight: 320,
  camHeight: 265, camBack: 330, camLook: -70,
  unlock: { dash: 4, blink: 9, spiral: 16, feint: 26, second: 60, third: 130 }  // seconds survived, before the mode multiplier
};

/* Three difficulty presets. "normal" gives you time to read the first attacks; "nightmare" is the brutal one. */
const MODES = {
  calm:      { label: 'سهل',   spd: 0.62, warn: 2.8, minWarn: 1.0,  minTel: 0.7,  minBlink: 1.0,  sig: 2.8, unlock: 3,   sink: 0.40, silent: 0,    dashSpd: 520, interval: 2.0,  show: 1,    homing: 0.15, surge: 1.4, appear: 0.5,  chain: 0,   decoys: 0, pull: 30, hound: 0.5 },
  normal:    { label: 'عادي',  spd: 0.75, warn: 2.2, minWarn: 0.7,  minTel: 0.5,  minBlink: 0.7,  sig: 2.2, unlock: 2.4, sink: 0.30, silent: 0,    dashSpd: 620, interval: 1.6,  show: 1,    homing: 0.3, surge: 1.6, appear: 0.4,  chain: 0.2, decoys: 0, pull: 50, hound: 0.62 },
  hard:      { label: 'صعب',   spd: 0.98, warn: 1.3, minWarn: 0.32, minTel: 0.22, minBlink: 0.32, sig: 1.3, unlock: 1.3, sink: 0.19, silent: 0.6, dashSpd: 850, interval: 1.1, show: 0.65, homing: 0.8, surge: 1.95, appear: 0.26, chain: 0.8, decoys: 1, pull: 95, hound: 0.72 },
  nightmare: { label: 'كابوس', spd: 1.15, warn: 0.8, minWarn: 0.12, minTel: 0.09, minBlink: 0.12, sig: 0.75, unlock: 0.7, sink: 0.14, silent: 1, dashSpd: 1100, interval: 0.8, show: 0.4, homing: 1.1, surge: 2.4, appear: 0.18, chain: 1.3, decoys: 3, pull: 135, hound: 0.82 }
};
let D = MODES.normal;
const un = k => CFG.unlock[k] * D.unlock;

const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const easeOut = g => 1 - Math.pow(1 - clamp(g, 0, 1), 3);
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const angDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));

const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('c');
const W = 1200, H = 800;          // room size in units
const PM = 50;                    // how close to the walls the player may stand
let vw = 800, vh = 600;           // viewport in pixels
const VIO = 0xa9a7c8, VIO2 = 0xd0cee8, WARM = 0xd6b27c;

/* ---------- 3D scene ---------- */
let renderer = null, scene = null, camera = null, pLight = null, pSpot = null, pGroup = null, dustGeo = null, dustPosA = null, dustColA = null, dustPts = null;
const POOL = { solid: [], dashed: [], disc: [], si: 0, di: 0, ci: 0, ls: 0, ld: 0, lc: 0 };
const cam = { x: W / 2, z: H / 2, inited: false, fov: 52 };
const mouse = { active: false, nx: 0, ny: 0, wx: W / 2, wz: H / 2 };
let ray = null, floorPlane = null, tmpV = null;
let sphereGeo = null, pShadow = null;
const lamps = [], voidLights = [];
const VT = { swirlA: null, swirlB: null, crack: null, holeGeo: null, planeGeo: null, flatGeo: null };

function arcGeo(inner, outer, count, fill, seg) {
  const pos = [], slot = Math.PI * 2 / count;
  for (let c = 0; c < count; c++) {
    const a0 = c * slot, a1 = a0 + slot * fill;
    for (let s = 0; s < seg; s++) {
      const t0 = a0 + (a1 - a0) * s / seg, t1 = a0 + (a1 - a0) * (s + 1) / seg;
      const c0 = Math.cos(t0), s0 = Math.sin(t0), c1 = Math.cos(t1), s1 = Math.sin(t1);
      pos.push(c0 * inner, 0, s0 * inner, c0 * outer, 0, s0 * outer, c1 * outer, 0, s1 * outer,
               c0 * inner, 0, s0 * inner, c1 * outer, 0, s1 * outer, c1 * inner, 0, s1 * inner);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  return g;
}
function makePool(arr, geo, n) {
  for (let i = 0; i < n; i++) {
    const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
    const m = new THREE.Mesh(geo, mat); m.visible = false; m.renderOrder = 2; scene.add(m); arr.push(m);
  }
}
const poolBegin = () => { POOL.si = 0; POOL.di = 0; POOL.ci = 0; };
function poolEnd() {
  for (let i = POOL.si; i < POOL.ls; i++) POOL.solid[i].visible = false;
  for (let i = POOL.di; i < POOL.ld; i++) POOL.dashed[i].visible = false;
  for (let i = POOL.ci; i < POOL.lc; i++) POOL.disc[i].visible = false;
  POOL.ls = POOL.si; POOL.ld = POOL.di; POOL.lc = POOL.ci;
}
function ring(x, z, r, a, hex, y) {
  if (a <= 0.004 || POOL.si >= POOL.solid.length) return;
  const m = POOL.solid[POOL.si++]; m.visible = true; m.position.set(x, y || 0.6, z); m.scale.set(r, 1, r);
  m.material.opacity = Math.min(1, a); m.material.color.setHex(hex);
}
function dashed(x, z, r, a, hex, rot) {
  if (a <= 0.004 || POOL.di >= POOL.dashed.length) return;
  const m = POOL.dashed[POOL.di++]; m.visible = true; m.position.set(x, 0.65, z); m.scale.set(r, 1, r); m.rotation.y = rot || 0;
  m.material.opacity = Math.min(1, a); m.material.color.setHex(hex);
}
function disc(x, z, r, a, hex, y) {
  if (a <= 0.004 || POOL.ci >= POOL.disc.length) return;
  const m = POOL.disc[POOL.ci++]; m.visible = true; m.position.set(x, y || 0.4, z); m.scale.set(r, 1, r);
  m.material.opacity = Math.min(1, a); m.material.color.setHex(hex);
}

/* ---- procedural textures: concrete, wet floor, smoke swirl, cracks, glow ---- */
function cnv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h || w; return c; }
function concreteCanvas(size, base, cracks, streaks) {
  const c = cnv(size), g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, size, size);
  for (let i = 0; i < 46; i++) {
    const x = rand(0, size), y = rand(0, size), r = rand(size * 0.05, size * 0.26), gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, Math.random() < 0.6 ? 'rgba(0,0,0,0.24)' : 'rgba(255,255,255,0.07)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  for (let i = 0; i < size * 5; i++) { g.fillStyle = 'rgba(' + (i % 2 ? '255,255,255' : '0,0,0') + ',' + (Math.random() * 0.07).toFixed(3) + ')'; g.fillRect(Math.random() * size, Math.random() * size, 1 + Math.random() * 2, 1 + Math.random() * 2); }
  if (streaks) for (let i = 0; i < 34; i++) {
    const x = rand(0, size), w = rand(2, 14), gr = g.createLinearGradient(0, 0, 0, size);
    gr.addColorStop(0, 'rgba(0,0,0,' + rand(0.05, 0.16).toFixed(3) + ')'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x, 0, w, rand(size * 0.3, size));
  }
  for (let k = 0; k < cracks; k++) {
    let x = rand(0, size), y = rand(0, size), a = rand(0, 6.283);
    g.strokeStyle = 'rgba(0,0,0,0.6)'; g.lineWidth = rand(0.7, 1.8); g.beginPath(); g.moveTo(x, y);
    const n = Math.floor(rand(12, 32));
    for (let s = 0; s < n; s++) { a += rand(-0.6, 0.6); x += Math.cos(a) * rand(6, 16); y += Math.sin(a) * rand(6, 16); g.lineTo(x, y); }
    g.stroke();
  }
  g.strokeStyle = 'rgba(0,0,0,0.55)'; g.lineWidth = 3; g.strokeRect(0, 0, size, size);
  return c;
}
function tex(canvas, rx, ry) {
  const t = new THREE.CanvasTexture(canvas); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); return t;
}
function wetCanvas(size) {
  const c = cnv(size), g = c.getContext('2d');

      this.presTone = c.createGain(); this.presTone.gain.value = 0; o1.connect(this.presTone); o2.connect(this.presTone); o1.start(); o2.start();

  /* route a node to the master through a panner, optionally with reverb */
  out(node, pan, wet) {

  toggle() {

  tone(f0, f1, dur, g, type, pan, delay, wet) {

    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);

  },
  noise(dur, g, f0, f1, pan, wet, q) {

    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = q || 1.2;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);

  silence(d) {

  /* a voice-like breath: two moving formants gated into syllables */

    f1.frequency.setValueAtTime(a, t); f1.frequency.linearRampToValueAtTime(b, t + dur);
    f2.frequency.setValueAtTime(a2, t); f2.frequency.linearRampToValueAtTime(b2, t + dur);

  drip(pan) { this.tone(rand(1100, 1700), 520, 0.09, 0.05, 'sine', pan, 0, 1); this.tone(rand(700, 900), 400, 0.07, 0.02, 'sine', pan, 0.13, 1); },
  /* two notes a semitone apart, far away, like a music box in an empty house */
  glass() {
    const f = rand(520, 760), pan = rand(-0.8, 0.8);
    this.tone(f, f * 0.998, 2.8, 0.025, 'sine', pan, 0, 1.4); this.tone(f * 1.0595, f * 1.06, 2.4, 0.02, 'sine', pan, 0.35, 1.4);
  },
  screech(pan, g) {

    [1, 1.019].forEach(m => {
      const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(520 * m, t); o.frequency.exponentialRampToValueAtTime(2300 * m, t + dur * 0.8);
      const v = c.createOscillator(); v.frequency.value = 31; const vg = c.createGain(); vg.gain.value = 60; v.connect(vg); vg.connect(o.frequency); v.start(t); v.stop(t + dur);
      const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.setValueAtTime(900, t); bp.frequency.exponentialRampToValueAtTime(2800, t + dur); bp.Q.value = 2.2;
      const ga = c.createGain(); ga.gain.setValueAtTime(0.0001, t); ga.gain.exponentialRampToValueAtTime(g || 0.1, t + 0.12); ga.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  },
  /* background life of the room; call every frame */
  ambient(dt, prox) {

    if (tm.drip <= 0) { tm.drip = rand(4, 11); this.drip(rand(-0.9, 0.9)); }

  warn(pan) { this.noise(0.38, 0.1, 500, 2200, pan, 0.3, 2.5); this.tone(78, 52, 0.34, 0.07, 'sine', pan); },
  sub(pan) { this.tone(58, 40, 0.3, 0.09, 'sine', pan); this.noise(0.25, 0.03, 220, 120, pan, 0.2); },
  vanish(pan) { this.noise(0.32, 0.09, 1900, 220, pan, 0.4, 1.8); this.tone(120, 42, 0.3, 0.07, 'triangle', pan); },

  voidDash(pan) { this.noise(0.5, 0.22, 1100, 140, pan, 0.3, 0.9); this.tone(66, 36, 0.5, 0.15, 'sine', pan); if (Math.random() < 0.5) this.whisper(pan, 0.1); },

  },
  playerDash() { this.noise(0.18, 0.1, 1500, 500, 0); },
  ready() { this.tone(520, 520, 0.06, 0.025, 'sine', 0); },
  heart(p) { const g = 0.07 + 0.24 * p; this.tone(64, 38, 0.17, g, 'sine', 0); this.tone(58, 36, 0.17, g * 0.7, 'sine', 0, 0.17); },
  breath(pan) { this.noise(0.9, 0.06, 420, 170, pan, 0.4, 1.6); },
  fall() { this.tone(110, 20, 1.5, 0.34, 'sine', 0, 0, 0.5); this.screech(0, 0.09); this.noise(0.9, 0.12, 300, 60, 0, 0.6); },
  dark() { this.noise(0.35, 0.18, 2200, 90, 0, 0.5, 0.8); this.tone(70, 28, 0.9, 0.3, 'sine', 0, 0, 0.5); },
  light() { this.tone(240, 360, 0.25, 0.03, 'sine', 0, 0, 0.6); },
  push(pan) { this.noise(0.14, 0.18, 700, 160, pan); this.tone(120, 60, 0.12, 0.12, 'sine', pan); },
  perk() { this.tone(330, 495, 0.22, 0.04, 'sine', 0, 0, 0.7); this.tone(495, 660, 0.3, 0.03, 'sine', 0, 0.12, 0.7); },
  other(pan) { this.tone(60, 30, 0.9, 0.18, 'sine', pan, 0, 0.5); this.whisper(pan, 0.08); }
};

/* ---------- Input ---------- */
const keys = new Set();
const joy = { active: false, id: null, ox: 0, oy: 0, x: 0, y: 0 };
const MOVE = { l: ['KeyA', 'ArrowLeft'], r: ['KeyD', 'ArrowRight'], u: ['KeyW', 'ArrowUp'], d: ['KeyS', 'ArrowDown'] };
const anyKey = a => a.some(k => keys.has(k));
function keyVec() {
  return { x: (anyKey(MOVE.r) ? 1 : 0) - (anyKey(MOVE.l) ? 1 : 0), y: (anyKey(MOVE.d) ? 1 : 0) - (anyKey(MOVE.u) ? 1 : 0) };
}
function inputDir() {
  let { x, y } = keyVec();
  if (joy.active) { x += joy.x; y += joy.y; }
  else if (Math.hypot(x, y) < 0.01 && mouse.active) {
    const dx = mouse.wx - P.x, dz = mouse.wz - P.y, d = Math.hypot(dx, dz), m = clamp((d - 14) / 110, 0, 1);
    if (d > 0.01) { x = dx / d * m; y = dz / d * m; }
  }
  const l = Math.hypot(x, y);
  if (l > 1) { x /= l; y /= l; }
  return { x, y, l: Math.min(1, l) };
}

/* ---------- World state ---------- */
const game = { state: 'menu', mode: 'normal', t: 0, best: 0, newRecord: false, deadAt: 0, dyingT: 0, dyingVoid: null, shake: 0 };
let P = null;
let voids = [];
let memory = [];
let ghosts = [];
let phantoms = [];
let darkF = 1;
const L = { r: 185, prox: 0, mul: 1, pulse: 0, pan: 0 };
let memTimer = 0, beat = 1.5, breathT = 3, phTimer = 6;
const deco = { t: 0 };
const dread = $('dread');

function setMode(m) {
  if (!MODES[m]) m = 'normal';
  game.mode = m; D = MODES[m];
  try { localStorage.setItem('void.mode', m); } catch (e) {}
  game.best = 0;
  try { game.best = parseFloat(localStorage.getItem('void.best.' + m)) || 0; } catch (e) {}
}
try { setMode(localStorage.getItem('void.mode') || 'normal'); } catch (e) { setMode('normal'); }

function newPlayer() {
  return { x: W / 2, y: H / 2, vx: 0, vy: 0, r: CFG.playerRadius, dashT: 0, dx: 1, dy: 0, cd: 0, sink: 0,
           fx: 1, fy: 0, scale: 1, ema: 0, dashLog: [], pulse: 0 };
}

/* ---------- Difficulty curve (keyed to seconds survived, scaled by the chosen mode) ---------- */
const warnTime = () => Math.max(D.minWarn, (0.5 - game.t * 0.002) * D.warn) * rand(0.8, 1.25);
const sigAlpha = () => Math.max(0.1, 0.4 - game.t * 0.003) * D.sig;
const interval = () => Math.max(0.5, 1.9 - 0.012 * game.t) * D.interval * rand(0.5, 1.5);

/* ---------- The Void ---------- */
class Void {
  constructor(scale, delay) {
    this.s = scale; this.R = CFG.voidRadius * scale; this.spd = scale < 1 ? 0.9 : 1; this.li = voids.length;
    const ang = Math.random() * Math.PI * 2, far = Math.min(W, H) * 0.5;
    this.x = clamp(P.x + Math.cos(ang) * far, 70, W - 70);
    this.y = clamp(P.y + Math.sin(ang) * far, 70, H - 70);
    if (Math.hypot(this.x - P.x, this.y - P.y) < 220) { this.x = P.x > W / 2 ? 90 : W - 90; this.y = P.y > H / 2 ? 90 : H - 90; }
    this.state = 'spawn'; this.delay = delay; this.grow = 0; this.t = 0; this.cd = 1.2;
    this.last = ''; this.rep = 0; this.seed = Math.random() * 10;
    this.mood = 'creep'; this.moodT = 0; this.curve = 0; this.vx = 0; this.vy = 0;
    this.heading = Math.atan2(P.y - this.y, P.x - this.x);
    this.chainLeft = 0; this.forceBlink = false; this.m = null;
    this.trail = []; this.tel = null; this.dash = null; this.sp = null; this.bl = null; this.flash = 0;
  }
  effR() { return this.R * easeOut(this.grow); }
  busy() { return this.state === 'telegraph' || this.state === 'dash' || this.state === 'spiral' || this.state === 'vanish' || this.state === 'hidden' || this.state === 'appear'; }
  pan(x) { return clamp(((x === undefined ? this.x : x) - P.x) / 450, -1, 1); }
  speed() { return (125 + Math.min(game.t, 120) * 1.3) * this.spd * D.spd; }

  update(dt) {
    this.t += dt; this.flash = Math.max(0, this.flash - dt * 2.5);
    for (const p of this.trail) p.a -= dt * 1.8;
    this.trail = this.trail.filter(p => p.a > 0);
    switch (this.state) {
      case 'spawn':
        if (this.delay > 0) { this.delay -= dt; return; }
        this.grow = Math.min(1, this.grow + dt / 1.6);
        if (this.grow >= 1) this.state = 'stalk';
        break;
      case 'stalk': this.stalk(dt); break;
      case 'telegraph': this.telegraph(dt); break;
      case 'dash': this.doDash(dt); break;
      case 'spiral': this.spiral(dt); break;
      case 'vanish':
        this.grow -= dt / 0.22;
        if (this.grow <= 0) { this.grow = 0; this.state = 'hidden'; this.bl.timer = this.bl.warn; this.bl.tick = 0; this.pickTarget(); }
        break;
      case 'hidden': this.hidden(dt); break;
      case 'appear':
        this.grow += dt / D.appear;
        if (this.grow >= 1) {
          this.grow = 1; this.state = 'stalk';
          if (this.chainLeft > 0) { this.chainLeft--; this.cd = 0.1; this.forceBlink = true; }
          else this.cd = interval();
        }
        break;
    }
    this.x = clamp(this.x, 40, W - 40); this.y = clamp(this.y, 40, H - 40);
  }

  /* erratic hunt: mood, speed and heading change on a random clock, so no rhythm can be learned */
  newMood() {
    const t = game.t;
    const opts = [['creep', 2], ['surge', 1.5 + Math.min(2.5, t / 40)], ['freeze', 1.4], ['curve', 2], ['shadow', 1.2], ['hound', 1.3 + Math.min(1.2, t / 60)]];
    for (const o of opts) if (o[0] === this.mood) o[1] *= 0.3;
    let sum = 0; for (const o of opts) sum += o[1];
    let r = Math.random() * sum, m = 'creep';
    for (const o of opts) { r -= o[1]; if (r <= 0) { m = o[0]; break; } }
    this.mood = m;
    this.moodT = m === 'creep' ? rand(0.4, 1.2) : m === 'surge' ? rand(0.28, 0.6) : m === 'freeze' ? rand(0.25, 0.9) : m === 'curve' ? rand(0.5, 1.1) : m === 'hound' ? rand(3, 6.5) : rand(0.5, 1.2);
    this.curve = rand(0.7, 1.3) * (Math.random() < 0.5 ? -1 : 1);
  }
  stalk(dt) {
    this.moodT -= dt; if (this.moodT <= 0) this.newMood();
    const dx = P.x - this.x, dy = P.y - this.y, d = Math.hypot(dx, dy) || 1;
    let want = Math.atan2(dy, dx), mul = 1;
    switch (this.mood) {
      case 'creep': mul = 0.45; break;
      case 'surge': {
        const tt = d / (this.speed() * D.surge);
        want = Math.atan2(P.y + P.vy * tt * 0.8 - this.y, P.x + P.vx * tt * 0.8 - this.x); mul = D.surge; break;
      }
      case 'freeze': mul = 0; break;
      case 'curve': want += this.curve; mul = 1.25; break;
      case 'hound': mul = Math.max(1.05, (CFG.playerSpeed * D.hound) / Math.max(1, this.speed())); break;
      default: mul = 0.95;
    }
    const turn = (this.mood === 'surge' ? 14 : this.mood === 'hound' ? 9 : 5) * dt;
    this.heading += clamp(angDiff(want, this.heading), -turn, turn);
    const sp = this.speed() * mul, k = 1 - Math.exp(-(mul > 1.5 ? 14 : 6) * dt);
    this.vx += (Math.cos(this.heading) * sp - this.vx) * k; this.vy += (Math.sin(this.heading) * sp - this.vy) * k;
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.cd -= dt;
    const lim = game.t > 120 * D.unlock ? 2 : 1;
    if (this.cd <= 0 && voids.filter(o => o !== this && o.busy()).length < lim) this.choose();
  }

  choose() {
    const t = game.t, d = Math.hypot(P.x - this.x, P.y - this.y);
    if (this.forceBlink) { this.forceBlink = false; this.beginBlink(); return; }
    const still = P.ema < 40, steady = P.ema > 110;
    const heavyDash = P.dashLog.filter(x => x > t - 9).length >= 2;
    const o = [];
    if (t >= un('dash') && d > 150) o.push(['dash', 3 + (still ? 2 : 0)]);
    if (t >= un('blink')) o.push(['blink', 3 + (steady ? 2 : 0)]);
    if (t >= un('spiral') && d > 140) o.push(['spiral', 1.3 + (still ? 1 : 0)]);
    if (t >= un('feint') && d > 170) o.push(['feint', 1.2 + (heavyDash ? 2 : 0)]);
    if (!o.length) { this.cd = 0.4; return; }
    for (const e of o) if (e[0] === this.last && this.rep >= 2) e[1] = 0.15;
    let sum = 0; for (const e of o) sum += e[1];
    let r = Math.random() * sum, pick = o[0][0];
    for (const e of o) { r -= e[1]; if (r <= 0) { pick = e[0]; break; } }
    if (pick === this.last) this.rep++; else { this.last = pick; this.rep = 1; }
    if (pick === 'dash' || pick === 'feint') this.beginDash(pick);
    else if (pick === 'blink') {
      this.chainLeft = Math.random() < clamp(0.12 + t * 0.004, 0, 0.55) * D.chain ? (t > 60 * D.unlock ? 2 : 1) : 0;
      this.beginBlink();
    } else this.beginSpiral();
  }

  /* dash: sometimes silent, no aim line, and it can bend toward you while it travels */
  beginDash(kind) {
    const silent = kind !== 'feint' && Math.random() < clamp(0.35 + game.t * 0.003, 0.35, 0.7) * D.silent;
    const warn = kind === 'chain' ? Math.max(0.2, D.minTel * 0.7) : Math.max(D.minTel, warnTime() * rand(0.5, 1));
    this.state = 'telegraph';
    this.tel = { kind, silent, dur: warn, left: warn, lock: Math.min(0.12, warn * 0.4), ang: 0, feintDone: false };
    this.aim();
    if (silent) Snd.sub(this.pan()); else Snd.warn(this.pan());
  }
  aim() {
    const d = Math.hypot(P.x - this.x, P.y - this.y), lead = clamp(0.5 + game.t * 0.004, 0.5, 1), tt = d / 650;
    this.tel.ang = Math.atan2(P.y + P.vy * tt * lead - this.y, P.x + P.vx * tt * lead - this.x);
  }
  telegraph(dt) {
    const tl = this.tel; tl.left -= dt;
    if (tl.left > tl.lock) this.aim();
    if (tl.kind === 'feint' && !tl.feintDone && tl.left <= tl.dur * 0.35) { tl.feintDone = true; this.beginBlink(Math.max(0.3, D.minBlink)); return; }
    if (tl.left <= 0) { this.state = 'dash'; this.dash = { t: 0, dur: 0.55, ang: tl.ang }; Snd.voidDash(this.pan()); }
  }
  doDash(dt) {
    const k = this.dash; k.t += dt;
    if (k.t < 0.35) {
      const turn = clamp(0.8 + game.t * 0.012, 0.8, 2.2) * D.homing * dt;
      k.ang += clamp(angDiff(Math.atan2(P.y - this.y, P.x - this.x), k.ang), -turn, turn);
    }
    const sp = D.dashSpd * (1 - 0.7 * clamp(k.t / k.dur, 0, 1));
    this.x += Math.cos(k.ang) * sp * dt; this.y += Math.sin(k.ang) * sp * dt;
    this.trail.push({ x: this.x, y: this.y, a: 1 });
    if (k.t >= k.dur || this.x < 45 || this.x > W - 45 || this.y < 45 || this.y > H - 45) { this.state = 'stalk'; this.cd = interval(); this.mood = 'freeze'; this.moodT = rand(0.2, 0.5); }
  }

  /* vanish, then reappear under, ahead of, behind or beside the player; decoy ripples can hide the real spot */
  beginBlink(warnOverride) {
    const warn = warnOverride || Math.max(D.minBlink, warnTime() * rand(0.7, 1.1));
    const kinds = ['under', 'under', 'ahead', 'behind', 'side'];
    const kind = kinds[Math.floor(Math.random() * kinds.length)];
    const a = Math.random() * Math.PI * 2;
    const m = kind === 'under' ? rand(0, 18) : kind === 'ahead' ? rand(100, 160) : kind === 'behind' ? rand(90, 130) : rand(80, 120) * (Math.random() < 0.5 ? -1 : 1);
    const decoys = [];
    const nd = D.decoys === 0 ? 0 : (game.t > 25 * D.unlock ? (Math.random() < 0.6 ? D.decoys : 1) : 1);
    for (let i = 0; i < nd; i++) {
      const da = Math.random() * Math.PI * 2, dr = rand(70, 260);
      decoys.push({ x: clamp(P.x + Math.cos(da) * dr, 60, W - 60), y: clamp(P.y + Math.sin(da) * dr, 60, H - 60) });
    }
    this.state = 'vanish';
    this.bl = { warn, timer: warn, tick: 0, sil: false, kind, m, ox: Math.cos(a) * m, oy: Math.sin(a) * m, tx: this.x, ty: this.y,
                lock: Math.min(0.18, warn * 0.5), show: Math.random() < D.show, decoys };
    Snd.vanish(this.pan());
  }
  pickTarget() {
    const b = this.bl, T = b.timer + D.appear, lead = clamp(0.4 + game.t * 0.005, 0.4, 1);
    const sp = Math.hypot(P.vx, P.vy), hx = sp > 20 ? P.vx / sp : P.fx, hy = sp > 20 ? P.vy / sp : P.fy;
    let bx = P.x + P.vx * T * lead, by = P.y + P.vy * T * lead;
    if (b.kind === 'under') { bx += b.ox; by += b.oy; }
    else if (b.kind === 'ahead') { bx += hx * b.m; by += hy * b.m; }
    else if (b.kind === 'behind') { bx -= hx * b.m; by -= hy * b.m; }
    else { bx += -hy * b.m; by += hx * b.m; }
    b.tx = clamp(bx, 60, W - 60); b.ty = clamp(by, 60, H - 60);
  }
  hidden(dt) {
    const b = this.bl; b.timer -= dt;
    if (b.timer > b.lock) this.pickTarget();
    b.tick -= dt; if (b.tick <= 0) { Snd.tick(this.pan(b.tx)); b.tick = 0.15; }
    if (!b.sil && b.timer < 0.12) { Snd.silence(0.12); b.sil = true; }
    if (b.timer <= 0) {
      this.x = b.tx; this.y = b.ty; this.state = 'appear'; this.grow = 0; this.flash = 1;
      this.vx = 0; this.vy = 0; this.heading = Math.atan2(P.y - this.y, P.x - this.x);
      Snd.appear(this.pan()); game.shake = Math.max(game.shake, Math.hypot(P.x - this.x, P.y - this.y) < 220 ? 1 : 0.4);
    }
  }

  /* closing spiral that ends in a short dash */
  beginSpiral() {
    const d = Math.hypot(P.x - this.x, P.y - this.y);
    this.state = 'spiral';
    this.sp = { t: 0, dur: rand(1.2, 1.7) * (D.warn > 1.2 ? 1.25 : 1), ang: Math.atan2(this.y - P.y, this.x - P.x), r0: clamp(d, 130, 220), cx: P.x, cy: P.y, dir: Math.random() < 0.5 ? 1 : -1, wob: rand(0, 6) };
    Snd.sub(this.pan());
  }
  spiral(dt) {
    const s = this.sp; s.t += dt; const f = clamp(s.t / s.dur, 0, 1);
    const dx = P.x - s.cx, dy = P.y - s.cy, dd = Math.hypot(dx, dy) || 1, mv = Math.min(dd, 150 * dt);
    s.cx += dx / dd * mv; s.cy += dy / dd * mv;
    s.ang += s.dir * (1.8 + 1.5 * f + 0.6 * Math.sin(s.t * 5 + s.wob)) * dt;
    const r = lerp(s.r0, 60, Math.pow(f, 0.9));
    const px = s.cx + Math.cos(s.ang) * r, py = s.cy + Math.sin(s.ang) * r, k = Math.min(1, 10 * dt);
    this.x += (px - this.x) * k; this.y += (py - this.y) * k;
    this.trail.push({ x: this.x, y: this.y, a: 1 });
    if (f >= 1) this.beginDash('chain');
  }

  /* ---- drawing (3D): an upright black portal wrapped in smoke, a dead patch of floor under it, and cracks around it ---- */
  ensureMesh() {
    if (this.m) return this.m;
    const g = new THREE.Group();
    const hole = new THREE.Mesh(VT.planeGeo, new THREE.MeshBasicMaterial({ map: VT.soft, transparent: true, depthWrite: false, fog: false })); hole.scale.setScalar(1.35); hole.position.z = 0.0;
    const mkSwirl = (map, blend, op) => new THREE.Mesh(VT.planeGeo, new THREE.MeshBasicMaterial({ map, transparent: true, opacity: op, depthWrite: false, side: THREE.DoubleSide, blending: blend }));
    const swA = mkSwirl(VT.swirlA, THREE.NormalBlending, 0.95); swA.scale.setScalar(1.7); swA.position.z = 0.01;
    const swB = mkSwirl(VT.swirlB, THREE.AdditiveBlending, 0.5); swB.scale.setScalar(1.9); swB.position.z = 0.02;
    g.add(hole, swA, swB); g.rotation.x = -Math.PI / 2; scene.add(g);
    const floorDisc = new THREE.Object3D();
    const crack = new THREE.Mesh(VT.flatGeo, new THREE.MeshBasicMaterial({ map: VT.crack, transparent: true, opacity: 0, depthWrite: false })); scene.add(crack);
    this.m = { g, hole, swA, swB, floorDisc, crack };
    return this.m;
  }
  removeMesh() {
    if (!this.m) return;
    scene.remove(this.m.g); scene.remove(this.m.floorDisc); scene.remove(this.m.crack);
    if (voidLights[this.li]) voidLights[this.li].intensity = 0;
    this.m = null;
  }

  draw3D() {
    const m = this.ensureMesh(), vl = voidLights[this.li];
    const gone = this.state === 'spawn' && this.grow <= 0;
    if (gone) { m.g.visible = false; m.floorDisc.visible = false; m.crack.visible = false; if (vl) vl.intensity = 0; return; }
    const hiddenNow = this.state === 'hidden', er = this.effR();
    m.crack.visible = true; m.crack.position.set(this.x, 0.3, this.y); m.crack.scale.setScalar(this.R * 2.7);
    m.crack.material.opacity = hiddenNow ? 0.4 : 0.4 + 0.5 * this.grow;
    if (hiddenNow || er < 0.5) { m.g.visible = false; m.floorDisc.visible = false; if (vl) vl.intensity = 0; return; }
    const lf = clamp(1 - Math.hypot(P.x - this.x, P.y - this.y) / (L.r + er), 0, 1);
    let jx = 0, jz = 0;
    if ((this.state === 'telegraph' || (this.state === 'stalk' && this.mood === 'freeze')) && !RM) { jx = rand(-1.6, 1.6); jz = rand(-1.6, 1.6); }
    const cx = this.x + jx, cz = this.y + jz, br = 1 + 0.025 * Math.sin(this.t * 2.2 + this.seed);
        m.g.visible = true; m.g.position.set(cx, 0.5, cz); m.g.scale.set(er * br, er * br, er * br);
    m.swA.rotation.z = this.t * 0.4; m.swB.rotation.z = -this.t * 0.28;
    m.swA.material.opacity = 0.5 + 0.2 * lf; m.swB.material.opacity = 0.18 + 0.22 * lf;
    
    for (const p of this.trail) ring(p.x, p.y, er * 0.9 * (0.5 + p.a * 0.5), p.a * 0.22 * Math.min(1, sigAlpha() * 2), VIO, 0.5);
    ring(cx, cz, er * 0.98, 0.06 + 0.2 * lf, VIO, 0.7);
    if (this.flash > 0) ring(cx, cz, this.R * (1 + (1 - this.flash) * 1.6), this.flash * 0.6, 0xe0dcff, 0.8);
  }

  /* only faint, short cues; there is no aim line and the dash path is never shown */
  signals3D() {
    const s = Math.min(1.2, sigAlpha() * 2);
    if (this.state === 'telegraph') {
      const tl = this.tel;
      if (tl.silent) return;
      const f = 1 - tl.left / tl.dur;
      ring(this.x, this.y, this.R * (1 + 1.4 * (1 - f)), (0.1 + 0.35 * f) * s, VIO2, 0.8);
    } else if (this.state === 'hidden') {
      const b = this.bl, f = 1 - b.timer / b.warn, a = (0.1 + 0.4 * f) * s;
      const mark = (x, z) => { ring(x, z, this.R * (1 + 1.5 * (1 - f)), a, VIO2, 0.8); dashed(x, z, this.R, a, VIO2, this.t); };
      if (b.show) mark(b.tx, b.ty);
      for (const d of b.decoys) mark(d.x, d.y);
    } else if (this.state === 'vanish') {
      ring(this.x, this.y, this.R * (1 + (1 - this.grow) * 0.8), 0.3 * s, VIO2, 0.8);
    } else if (this.state === 'spiral') {
      for (let i = 0; i < this.trail.length; i += 2) disc(this.trail[i].x, this.trail[i].y, 2.2, this.trail[i].a * 0.3 * s, VIO2, 0.5);
    }
  }
}

function clearVoids() { for (const v of voids) v.removeMesh(); voids = []; }

/* ---------- Update ---------- */
function updatePlayer(dt) {
  const d = inputDir();
  if (d.l > 0.05) { P.fx = d.x / (d.l || 1); P.fy = d.y / (d.l || 1); }
  if (P.dashT > 0) {
    P.dashT -= dt;
    const sp = CFG.dashSpeed * (0.55 + 0.45 * clamp(P.dashT / CFG.dashTime, 0, 1));
    P.vx = P.dx * sp; P.vy = P.dy * sp;
    ghosts.push({ x: P.x, y: P.y, a: 1 });
  } else {
    const k = 1 - Math.exp(-11 * dt);
    const ps = CFG.playerSpeed * (P.spdMul || 1);
    P.vx += (d.x * ps - P.vx) * k; P.vy += (d.y * ps - P.vy) * k;
  }
  if (P.cd > 0) { P.cd -= dt; if (P.cd <= 0) { P.cd = 0; P.pulse = 0.35; Snd.ready(); } }
  P.pulse = Math.max(0, P.pulse - dt);
  if (P.shx || P.shy) { P.x += P.shx * dt; P.y += P.shy * dt; const dk = Math.exp(-8 * dt); P.shx *= dk; P.shy *= dk; if (Math.hypot(P.shx, P.shy) < 8) P.shx = P.shy = 0; }
  P.x = clamp(P.x + P.vx * dt, PM, W - PM); P.y = clamp(P.y + P.vy * dt, PM, H - PM);
  const sp = Math.hypot(P.vx, P.vy); P.ema += (sp - P.ema) * Math.min(1, dt * 1.5);
  memTimer -= dt;
  if (memTimer <= 0 && sp > 40) { memory.push({ x: P.x, y: P.y, a: 1 }); memTimer = 0.14; if (memory.length > 60) memory.shift(); }
}

function tryDash() {
  if (game.state !== 'play' || P.cd > 0 || P.dashT > 0) return;
  let { x, y } = keyVec(), l = Math.hypot(x, y);
  if (l < 0.1 && joy.active) { x = joy.x; y = joy.y; l = Math.hypot(x, y); }
  if (l < 0.1 && mouse.active) { x = mouse.wx - P.x; y = mouse.wz - P.y; l = Math.hypot(x, y); if (l < 8) l = 0; }
  if (l < 0.1) { x = P.fx; y = P.fy; l = Math.hypot(x, y) || 1; }
  P.dx = x / l; P.dy = y / l; P.dashT = CFG.dashTime; P.cdMax = CFG.dashCooldown * (P.cdMul || 1); P.cd = P.cdMax;
  if (NET.on) netSend({ t: 'dash' });
  P.dashLog.push(game.t); if (P.dashLog.length > 12) P.dashLog.shift();
  Snd.playerDash();
}

function updateWorld(dt) {
  if (dustPosA) {
    for (let i = 0; i < dustPosA.length; i += 3) {
      dustPosA[i] += Math.sin(i + deco.t * 0.2) * 6 * dt; dustPosA[i + 2] += Math.cos(i * 1.3 + deco.t * 0.17) * 5 * dt;
      dustPosA[i + 1] += Math.sin(i * 0.7 + deco.t * 0.3) * 2 * dt;
      if (dustPosA[i] < 0) dustPosA[i] += W; if (dustPosA[i] > W) dustPosA[i] -= W;
      if (dustPosA[i + 2] < 0) dustPosA[i + 2] += H; if (dustPosA[i + 2] > H) dustPosA[i + 2] -= H;
      dustPosA[i + 1] = clamp(dustPosA[i + 1], 4, 120);
    }
  }
  deco.t += dt;
  for (const m of memory) m.a -= dt / 5;
  memory = memory.filter(m => m.a > 0);
  for (const g of ghosts) g.a -= dt * 5;
  ghosts = ghosts.filter(g => g.a > 0);
  for (const p of phantoms) p.age += dt;
  phantoms = phantoms.filter(p => p.age < p.life);
  game.shake = Math.max(0, game.shake - dt * 3);
}

/* false sightings at the edge of the light: a ring flickers somewhere, then is gone */
function updatePhantoms(dt) {
  if (game.t < 6 * D.unlock) return;
  phTimer -= dt;
  if (phTimer <= 0) {
    phTimer = rand(2.5, 7) / (1 + game.t / 70);
    const a = rand(0, 6.283), r = rand(110, 300);
    const x = clamp(P.x + Math.cos(a) * r, 70, W - 70), y = clamp(P.y + Math.sin(a) * r, 70, H - 70);
    phantoms.push({ x, y, age: 0, life: rand(0.25, 0.6), R: rand(28, 44) });
    if (Math.random() < 0.5) Snd.tick(clamp((x - P.x) / 450, -1, 1));
  }
}

function computeLight(now, dt) {
  let near = 1e9, nv = null, hiddenAny = false;
  for (const v of voids) {
    if (v.state === 'vanish' || v.state === 'hidden') hiddenAny = true;
    if (v.state === 'hidden' || v.grow <= 0) continue;
    const q = NET.on && !NET.alive && NET.specPos ? NET.specPos : P;
    const d = Math.hypot(q.x - v.x, q.y - v.y) - v.effR();
    if (d < near) { near = d; nv = v; }
  }
  L.prox = nv ? 1 - smooth((near - 10) / 420) : 0;
  L.mul += ((hiddenAny ? 0.55 : 1) - L.mul) * Math.min(1, dt * 5);
  L.pulse = Math.max(0, L.pulse - dt * 4);
  L.pan = nv ? nv.pan() : 0;
  let r = CFG.lightRadius * (1 - 0.55 * L.prox) * L.mul * (1 + 0.05 * L.pulse) * darkF;
  if (NET.on && NET.perks.lantern > 0) r *= 1.55;
  if (!RM) {
    r *= 1 + 0.03 * Math.sin(now * 0.013) + 0.02 * Math.sin(now * 0.031);
    if (L.prox > 0.5 && Math.random() < 0.1) r *= 0.78;
  }
  L.r = r;
  Snd.setHum(nv ? L.prox : 0, L.pan);

  if (game.t > 2 && (!NET.on || NET.alive)) {
    beat -= dt;
    if (beat <= 0) { Snd.heart(L.prox); L.pulse = 1; beat = lerp(1.25, 0.4, L.prox); }
  }
  if (L.prox > 0.3) { breathT -= dt; if (breathT <= 0) { Snd.breath(L.pan); breathT = rand(2, 4.5); } }
  dread.style.opacity = Math.max(L.prox * 0.6 + L.pulse * 0.12 * (0.3 + L.prox), (1 - darkF) * 0.55).toFixed(3);
}

const pad2 = n => String(Math.floor(n)).padStart(2, '0');
const fmt = t => pad2(t / 60) + ':' + pad2(t % 60);
const hudTime = $('time'), hudBest = $('best'), hudMode = $('modeTag'), segs = $('segs').children, hints = $('hints');
let lastSec = -1, lastLit = -1;
function updateHud() {
  const s = Math.floor(game.t);
  if (s !== lastSec) { lastSec = s; hudTime.textContent = fmt(s); }
  const lit = P.cd > 0 ? Math.floor((1 - P.cd / (P.cdMax || CFG.dashCooldown)) * 7) : 7;
  if (lit !== lastLit) { lastLit = lit; for (let i = 0; i < 7; i++) segs[i].className = i < lit ? 'on' : ''; }
}
function setBestHud() { hudBest.textContent = fmt(game.best); hudMode.textContent = '· ' + D.label; }

function updatePlay(dt, now) {
  game.t += dt;
  updatePlayer(dt);
  for (const v of voids) v.update(dt);
  if (game.t >= un('second') && voids.length < 2) voids.push(new Void(0.85, 0.8));
  if (game.t >= un('third') && voids.length < 3) voids.push(new Void(0.7, 0.8));
  for (let i = 0; i < voids.length; i++) for (let j = i + 1; j < voids.length; j++) {
    const a = voids[i], b = voids[j];
    if (a.state !== 'stalk' || b.state !== 'stalk') continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, min = a.effR() + b.effR();
    if (d < min) { const p = (min - d) * 0.5; a.x -= dx / d * p; a.y -= dy / d * p; b.x += dx / d * p; b.y += dy / d * p; }
  }

  let sinking = null, rate = 0;
  for (const v of voids) {
    if (v.state === 'hidden' || v.grow < 0.8) continue;
    const er = v.effR(), dx = v.x - P.x, dy = v.y - P.y, d = Math.hypot(dx, dy);
    const zone = er * (v.state === 'dash' ? 0.85 : 0.92);
    if (d < zone) {
      const r = v.state === 'dash' ? 1 / 0.06 : 1 / D.sink;
      if (r > rate) { rate = r; sinking = v; }
    } else if (d < er * 2.6 && P.dashT <= 0) {
      const pull = D.pull * clamp(1 - (d - er) / (1.6 * er), 0, 1);
      P.x += dx / d * pull * dt; P.y += dy / d * pull * dt;
    }
  }
  if (sinking) {
    P.sink += rate * dt;
    P.x += (sinking.x - P.x) * P.sink * dt * 4; P.y += (sinking.y - P.y) * P.sink * dt * 4;
  } else P.sink = Math.max(0, P.sink - dt * 3.5);
  P.scale = 1 - 0.55 * clamp(P.sink, 0, 1);
  if (P.sink >= 1) die(sinking);

  updateWorld(dt); updatePhantoms(dt); computeLight(now, dt); updateHud();
}

function die(v) {
  game.state = 'dying'; game.dyingT = 0; game.dyingVoid = v;
  game.newRecord = game.t > game.best;
  if (game.newRecord) { game.best = game.t; try { localStorage.setItem('void.best.' + game.mode, String(game.best)); } catch (e) {} }
  Snd.fall(); Snd.setHum(0, 0);
  $('dashbtn').classList.remove('on'); stage.style.cursor = ''; hints.hidden = true;
}
function updateDying(dt) {
  game.dyingT += dt;
  const v = game.dyingVoid;
  if (v) { P.x += (v.x - P.x) * Math.min(1, 5 * dt); P.y += (v.y - P.y) * Math.min(1, 5 * dt); }
  P.scale = Math.max(0, 0.45 * (1 - game.dyingT / 0.9));
  for (const x of voids) x.update(dt);
  updateWorld(dt);
  L.r = Math.max(14, 110 * (1 - game.dyingT / 1.0));
  dread.style.opacity = '0';
  if (game.dyingT >= 1.1) { game.state = 'dead'; game.deadAt = performance.now(); showPanel('dead'); }
}

/* ---------- Rendering ---------- */
function syncScene(now, dt) {
  poolBegin();

  // camera: low chase view, wider on tall screens
  const asp = vw / vh, sc = asp < 1.15 ? clamp(1.15 / asp * 0.85, 1, 2.3) : 1;
  const FP = NET.on && NET.phase !== 'lobby' && !NET.alive && NET.specPos ? NET.specPos : P;
  let fx = FP.x, fz = FP.y;
  if (game.state === 'menu') { fx = W / 2 + Math.sin(now * 0.00015) * 60; fz = H / 2 + Math.cos(now * 0.00012) * 40; }
  if (!cam.inited) { cam.x = fx; cam.z = fz; cam.inited = true; }
  const k = 1 - Math.exp(-6 * dt);
  cam.x += (fx - cam.x) * k; cam.z += (fz - cam.z) * k;
  const sk = RM ? 0 : game.shake * 6;
  camera.position.set(cam.x + rand(-sk, sk), CFG.camHeight * sc + rand(-sk, sk), cam.z + CFG.camBack * sc);
  camera.lookAt(cam.x, 0, cam.z + CFG.camLook);
  if (!RM && game.state === 'play') camera.rotateZ((Math.sin(now * 0.0011) * 0.012 + (Math.random() - 0.5) * 0.004) * (0.3 + L.prox * 2));
  const fov = 52 - 2.2 * L.pulse * L.prox;
  if (Math.abs(fov - cam.fov) > 0.01) { cam.fov = fov; camera.fov = fov; camera.updateProjectionMatrix(); }
  camera.updateMatrixWorld();

  // pointer to floor point
  if (mouse.active) {
    ray.setFromCamera({ x: mouse.nx, y: mouse.ny }, camera);
    if (ray.ray.intersectPlane(floorPlane, tmpV)) { mouse.wx = tmpV.x; mouse.wz = tmpV.z; }
  }

  // player + lights
  const psc = P.scale, sp = Math.hypot(P.vx, P.vy);
  pGroup.visible = psc > 0.02 && !(NET.on && (NET.phase === 'lobby' || !NET.alive));
  pGroup.position.set(P.x, -(1 - psc) * 16, P.y);
  if (sp > 20) pGroup.rotation.y += angDiff(-Math.atan2(P.vy, P.vx), pGroup.rotation.y) * Math.min(1, dt * 12);
  pGroup.scale.setScalar(P.r * psc);
  pShadow.position.set(P.x, 0.7, P.y + 3); pShadow.scale.setScalar(P.r * 15 * psc); pShadow.visible = pGroup.visible;
  animateChibi(now, sp);
  const lk = clamp(L.r / CFG.lightRadius, 0.15, 1.4);
  pLight.position.set(FP.x, 55, FP.y); pLight.distance = L.r * 1.7; pLight.intensity = 0.5 * lk;
  pSpot.position.set(FP.x + 10, 150, FP.y - 20); pSpot.target.position.set(FP.x, 0, FP.y);
  pSpot.angle = clamp(0.5 + 0.45 * lk, 0.3, 1.1); pSpot.intensity = 1.0 * clamp(lk, 0.2, 1.2);
  pSpot.distance = 400 + L.r;
  lamps.forEach((l, i) => {

          toast('سقطت! تابع الباقين… (انقر للتبديل)', 3200); specNext(true);
        } else {
          Snd.other(clamp(((NET.rem[e.id] ? NET.rem[e.id].x : ep.x) - ep.x) / 450, -1, 1));
          toast((NET.names[e.id] || 'لاعب') + (e.cause === 'left' ? ' غادر' : ' سقط'), 1800);
          if (NET.spec === e.id) specNext(true);
        }
        break;
    }
  }
}

function specNext(first) {
  const v = NET.view; if (!v) return;
  const ids = NET.order.filter(i => i !== NET.id && v.players[i] && v.players[i].alive);
  if (!ids.length) { NET.spec = 0; return; }
  const k = ids.indexOf(NET.spec); NET.spec = ids[(k + 1) % ids.length];
  const p = v.players[NET.spec]; if (p) NET.specPos = { x: p.x, y: p.y };
}

function tryPush() {
  if (!NET.on || !NET.alive || NET.phase !== 'play' || (P.pcd || 0) > 0) return;
  P.pcd = 2.6; netSend({ t: 'push' }); Snd.playerDash();
}

function updateMP(dt, now) {
  const N = NET;
  const dk = N.darkUntil > now ? 0.05 : 1; darkF += (dk - darkF) * Math.min(1, dt * (dk < darkF ? 20 : 2.5));
  if (N.last) game.t = N.last.n + clamp((now - N.lastRt) / 1000, 0, 0.2);
  if (N.phase === 'count') { N.count -= dt; countEl.textContent = String(Math.max(1, Math.ceil(N.count))); }
  for (const k in N.perks) N.perks[k] = Math.max(0, N.perks[k] - dt);
  N.pingT -= dt; if (N.pingT <= 0) { N.pingT = 2; netSend({ t: 'pg', c: performance.now() }); }
  const view = netView(now); N.view = view;
  if (view) applyVoids(view, dt);
  if (N.alive) {
    P.spdMul = N.perks.speed > 0 ? 1.28 : 1; P.cdMul = N.perks.dash > 0 ? 0.35 : 1;
    P.pcd = Math.max(0, (P.pcd || 0) - dt);
    if (N.phase === 'play') updatePlayer(dt); else { P.vx = P.vy = 0; }
    const me = view && view.players[N.id];
    if (me) {
      P.sink = me.sink; P.scale = 1 - 0.55 * me.sink;
      if (me.sink > 0.03) {
        let bv = null, bd = 1e9;
        for (const v of voids) { if (v.state === 'hidden' || v.grow < 0.5) continue; const d = Math.hypot(v.x - P.x, v.y - P.y); if (d < bd) { bd = d; bv = v; } }
        if (bv) { P.x += (bv.x - P.x) * me.sink * dt * 4; P.y += (bv.y - P.y) * me.sink * dt * 4; }
      }
    }
    N.sendT -= dt;
    if (N.sendT <= 0 && N.phase === 'play') { N.sendT = 0.033; netSend({ t: 'in', l: Math.round(NET.ping || 0), x: +P.x.toFixed(1), y: +P.y.toFixed(1), vx: Math.round(P.vx), vy: Math.round(P.vy), d: P.dashT > 0 ? 1 : 0 }); }
  } else if (view) {
    const sp = view.players[N.spec];
    if (!sp || !sp.alive) specNext(true); else N.specPos = { x: sp.x, y: sp.y };
  }
  if (N.phase === 'over') { N.overT -= dt; if (N.overT <= 0 && !panelShowingOver && NET.res) { panelShowingOver = true; showPanel('mpover'); } }
  updateWorld(dt); computeLight(now, dt); updateHud(); updateMpUi(dt);
}
let panelShowingOver = false;

function updateMpUi(dt) {
  NET.uiT -= dt; if (NET.uiT > 0) return; NET.uiT = 0.2;
  const v = NET.view, alive = v ? NET.order.filter(i => v.players[i] && v.players[i].alive).length : NET.total;
  pushBtn.textContent = (P.pcd || 0) > 0 ? P.pcd.toFixed(1) : 'دفع'; pushBtn.style.opacity = (P.pcd || 0) > 0 ? '0.5' : '1';
  let txt = 'المتبقون ' + alive + '/' + NET.total + ' · ' + NET.ping + 'ms';
  if (NET.phase === 'play' || NET.phase === 'count') {
    if (!NET.alive) txt = 'تتابع: ' + (NET.names[NET.spec] || '—') + ' · انقر للتبديل · المتبقون ' + alive;
    else txt += ' · الدفع (E): ' + ((P.pcd || 0) > 0 ? P.pcd.toFixed(1) + 'ث' : 'جاهز');
  }
  mpbar.textContent = txt;
  const act = Object.keys(NET.perks).filter(k => NET.perks[k] > 0);
  perksEl.hidden = !act.length; perksEl.innerHTML = act.map(k => '<span>' + PERK_AR[k] + ' ' + Math.ceil(NET.perks[k]) + '</span>').join('');
  const sig = NET.order.map(i => i + (v && v.players[i] && v.players[i].alive ? 1 : 0)).join(',');
  if (sig !== NET.rosterSig) {
    NET.rosterSig = sig;
    rosterEl.innerHTML = NET.order.map(i => '<div class="rs' + (v && v.players[i] && !v.players[i].alive ? ' dead' : '') + '"><span class="nb" style="background:' + palHex(i) + '">' + i + '</span><span>' + esc(NET.names[i] || '') + (i === NET.id ? ' (أنت)' : '') + '</span></div>').join('');
  }
}

function endMP(m) {
  NET.phase = 'over'; NET.res = m; NET.overT = NET.alive ? 0.8 : 1.4; panelShowingOver = false;
  stage.style.cursor = ''; dashBtn.classList.remove('on'); pushBtn.classList.remove('on');
  if (NET.alive) { toast('أنت الأخير!', 3000); }
  countEl.hidden = true;
}

/* own markers + other players, drawn inside syncScene (the ring pool is open there) */
function syncRemotes(now, dt) {
  const view = NET.view; if (!view || NET.phase === 'lobby') return;
  const ep = eyePos();
  for (const id in NET.rem) {
    const r = NET.rem[id], q = view.players[id]; if (!q) { r.g.visible = false; r.label.visible = false; r.sh.visible = false; continue; }
    if (r.sx === undefined) { r.sx = q.x; r.sy = q.y; } else { const k = Math.min(1, dt * 16); r.sx += (q.x + q.vx * 0.04 - r.sx) * k; r.sy += (q.y + q.vy * 0.04 - r.sy) * k; if (Math.hypot(q.x - r.sx, q.y - r.sy) > 120) { r.sx = q.x; r.sy = q.y; } }
    r.x = r.sx; r.y = r.sy;
    const sc = q.alive ? 1 - 0.55 * q.sink : 0, vis = sc > 0.02;
    r.g.visible = vis; r.sh.visible = vis; r.label.visible = vis && darkF > 0.5;
    if (!vis) continue;
    r.g.position.set(r.x, -(1 - sc) * 16, r.y); r.g.scale.setScalar(CFG.playerRadius * sc);
    const sp = Math.hypot(q.vx, q.vy); if (sp > 20) r.g.rotation.y += angDiff(-Math.atan2(q.vy, q.vx), r.g.rotation.y) * Math.min(1, dt * 12);
    r.sh.position.set(r.x, 0.7, r.y + 3); r.sh.scale.setScalar(CFG.playerRadius * 15 * sc);
    { const st = animateChibiObj(r.PL, now + r.id * 137, sp, !!q.dash, 0); if (st) { const dd = Math.hypot(r.x - ep.x, r.y - ep.y), v = clamp(1 - dd / 560, 0, 1); if (v > 0.05) Snd.step(0.5 * v, clamp((r.x - ep.x) / 450, -1, 1), st === 2); } }
    r.label.position.set(r.x, 50, r.y); r.label.material.opacity = clamp(1.25 - Math.hypot(r.x - ep.x, r.y - ep.y) / 800, 0.4, 1);
    ring(r.x, r.y, CFG.playerRadius + 8, 0.22 * (0.3 + 0.7 * darkF), PAL[(r.id - 1) % 8], 0.7);
    if (q.shield) ring(r.x, r.y, CFG.playerRadius + 15, 0.7, 0xffffff, 0.8);
  }
  if (NET.alive) {
    ring(P.x, P.y, P.r + 8, 0.28 * (0.3 + 0.7 * darkF), PAL[(NET.id - 1) % 8], 0.7);
    if (NET.perks.shield > 0) ring(P.x, P.y, P.r + 15, 0.75, 0xffffff, 0.8);
    if ((P.pcd || 0) > 0) { const prog = 1 - P.pcd / 2.6, n = 12; for (let i = 0; i < n; i++) if (i < prog * n) disc(P.x + Math.cos(i / n * 6.283) * (P.r + 19), P.y + Math.sin(i / n * 6.283) * (P.r + 19), 1.2, 0.5, 0x8fd3ff, 0.8); }
  }
  for (const f of NET.fx) { f.a -= dt * 3.2; ring(f.x, f.y, 14 + (1 - f.a) * 70, Math.max(0, f.a) * 0.6, 0x8fd3ff, 0.9); }
  NET.fx = NET.fx.filter(f => f.a > 0);
}

/* ---- panels ---- */
function showMpPanel(mode) {
  panel.hidden = false;
  if (mode === 'mpjoin') {
    let nm = '', rm = 'VOID';
    try { nm = localStorage.getItem('void.name') || ''; rm = localStorage.getItem('void.room') || 'VOID'; } catch (e) {}
    const q = /[?&]room=([^&]+)/.exec(location.search); if (q) { try { rm = decodeURIComponent(q[1]); } catch (e) {} }
    card.innerHTML = '<h1 class="title small">جماعي</h1>' +
      '<p class="lede">العب مع أصدقائك من أجهزة مختلفة. اكتبوا نفس اسم الغرفة وادخلوها جميعاً.</p>' +
      '<input id="mpname" class="field" maxlength="14" placeholder="اسمك" autocomplete="off" value="' + esc(nm) + '">' +
      '<input id="mproom" class="field" maxlength="12" placeholder="اسم الغرفة" autocomplete="off" value="' + esc(rm) + '">' +
      '<p class="err">' + esc(NET.err || '') + '</p>' +
      '<button class="btn" id="mpenter" type="button">ادخل الغرفة</button>' +
      '<button class="chip" id="mpback" type="button">رجوع</button>';
    const enter = () => {
      const n = $('mpname').value.trim(), r = $('mproom').value.trim();
      if (!n) { NET.err = 'اكتب اسمك أولاً.'; showMpPanel('mpjoin'); return; }
      Snd.init(); netConnect(n, r || 'VOID');
    };
    $('mpenter').addEventListener('click', enter);
    card.querySelectorAll('.field').forEach(f => f.addEventListener('keydown', e => { if (e.key === 'Enter') enter(); }));
    $('mpback').addEventListener('click', () => { NET.err = ''; showPanel('menu'); });
    try { (nm ? $('mproom') : $('mpname')).focus({ preventScroll: true }); } catch (e) {}
  } else if (mode === 'mpconn') {
    card.innerHTML = '<h1 class="title small">اتصال…</h1><p class="lede">جارٍ الاتصال بالخادم. الخادم المجاني قد يحتاج حتى نصف دقيقة ليستيقظ في أول مرة.</p><button class="chip" id="mpcancel" type="button">إلغاء</button>';
    $('mpcancel').addEventListener('click', () => { netClose(true); });
  } else if (mode === 'mplobby') {
    const m = NET.lob; if (!m) return;
    const me = m.ps.find(p => p.i === NET.id), isHost = NET.id === m.host;
    const others = m.ps.filter(p => p.i !== m.host);
    const allReady = others.every(p => p.r), enough = m.ps.length >= m.min;
    const can = isHost && enough && allReady;
    const rows = m.ps.slice().sort((a, b) => a.i - b.i).map(p =>
      '<li><span class="nb" style="background:' + palHex(p.i) + '">' + p.i + '</span><span class="nm">' + esc(p.n) + (p.i === NET.id ? ' (أنت)' : '') + '</span>' +
      (p.i === m.host ? '<span class="st">المضيف</span>' : '<span class="st' + (p.r ? ' ok' : '') + '">' + (p.r ? 'جاهز ✓' : 'ينتظر') + '</span>') + '</li>').join('');
    const chips = isHost ? '<div class="chips" role="group" aria-label="الصعوبة">' + Object.keys(MODES).map(k => '<button class="chip' + (k === m.mode ? ' on' : '') + '" type="button" data-mode="' + k + '">' + MODES[k].label + '</button>').join('') + '</div>' : '<span class="hint">الصعوبة: ' + esc((MODES[m.mode] || MODES.normal).label) + '</span>';
    let status = '';
    if (isHost) status = !enough ? 'يلزم ' + m.min + ' لاعبين على الأقل للبدء.' : (!allReady ? 'بانتظار جاهزية بقية اللاعبين.' : 'الجميع جاهز. ابدأ متى شئت.');
    else status = me && me.r ? 'أنت جاهز. بانتظار المضيف.' : 'اضغط «جاهز» عندما تكون مستعداً.';
    card.innerHTML = '<h1 class="rt">غرفة ' + esc(m.room) + '</h1>' +
      '<p class="sub">' + m.ps.length + ' / ' + m.max + ' لاعبين</p>' +
      '<ul class="plist">' + rows + '</ul>' + chips +
      '<p class="lede">' + esc(status) + '</p>' +
      (isHost ? '<button class="btn" id="mpstart" type="button"' + (can ? '' : ' disabled') + '>ابدأ اللعبة</button>'
              : '<button class="btn" id="mpready" type="button">' + (me && me.r ? 'إلغاء الجاهزية' : 'جاهز') + '</button>') +
      '<button class="chip" id="mpcopy" type="button">نسخ رابط الدعوة</button>' +
      '<button class="chip" id="mpleave" type="button">مغادرة</button>' +
      '<span class="hint">E أو النقر الأيمن: دفع · الدخول مغلق بعد بدء اللعبة</span>';
    const st = $('mpstart'); if (st) st.addEventListener('click', () => { Snd.init(); netSend({ t: 'start' }); });
    const rd = $('mpready'); if (rd) rd.addEventListener('click', () => { Snd.init(); netSend({ t: 'ready', v: me && me.r ? 0 : 1 }); });
    card.querySelectorAll('.chip[data-mode]').forEach(b => b.addEventListener('click', () => netSend({ t: 'mode', m: b.dataset.mode })));
    $('mpleave').addEventListener('click', () => netClose(true));
    $('mpcopy').addEventListener('click', e => {
      const link = location.origin + '/?room=' + encodeURIComponent(m.room), btn = e.currentTarget;
      const done = () => { btn.textContent = 'تم النسخ ✓'; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, () => { prompt('انسخ الرابط:', link); });
      else prompt('انسخ الرابط:', link);
    });
  } else if (mode === 'mpover') {
    const r = NET.res; if (!r) return;
    mpbar.hidden = true;
    const win = r.win, iWon = win && win.i === NET.id;
    const rows = r.rank.map((p, k) => '<li class="' + (p.w ? 'w' : '') + '"><span class="nb" style="background:' + palHex(p.i) + '">' + p.i + '</span><span class="nm">' + (k + 1) + '. ' + esc(p.n) + (p.i === NET.id ? ' (أنت)' : '') + '</span><span class="tm">' + p.t.toFixed(1) + ' ث</span></li>').join('');
    card.innerHTML = '<h1 class="title small">' + (iWon ? 'نجوت!' : (win ? 'الفائز' : 'انتهت')) + '</h1>' +
      (win ? '<p class="sub">' + esc(win.n) + (iWon ? ' — أنت آخر الناجين' : '') + '</p>' : '') +
      '<ul class="rank">' + rows + '</ul>' +
      '<p class="lede">سيُعاد الجميع إلى الغرفة بعد لحظات…</p>' +
      '<button class="chip" id="mpleave" type="button">مغادرة</button>';
    $('mpleave').addEventListener('click', () => netClose(true));
  }
}

/* ---------- Events ---------- */
window.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  const k = e.code;
  if (k === 'Space' || k.startsWith('Arrow')) e.preventDefault();
  const fresh = !keys.has(k); keys.add(k);
  if (!fresh) return;
  if (k === 'KeyM') { $('mute').textContent = 'الصوت: ' + (Snd.toggle() ? 'تشغيل' : 'إيقاف'); return; }
  if (game.state === 'play') {
    if (k === 'ShiftLeft' || k === 'ShiftRight' || k === 'Space') tryDash();
    else if (k === 'KeyE' || k === 'KeyF') tryPush();
    else if (k === 'KeyP' || k === 'Escape') pause();
  } else if (game.state === 'spec') {
    if (k === 'Space' || k.startsWith('Arrow') || k === 'Enter') specNext();
  } else if (game.state === 'paused') {
    if (k === 'KeyP' || k === 'Escape' || k === 'Enter') resume();
  } else if (game.state === 'menu') {
    if (k === 'Enter' || k === 'Space') primary();
  } else if (game.state === 'dead') {
    if (k === 'Enter' || k === 'KeyR' || k === 'Space') primary();
  }
});
window.addEventListener('keyup', e => keys.delete(e.code));
window.addEventListener('blur', () => { keys.clear(); if (game.state === 'play') pause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && game.state === 'play' && !NET.on) pause(); });

$('mute').addEventListener('click', e => { e.currentTarget.textContent = 'الصوت: ' + (Snd.toggle() ? 'تشغيل' : 'إيقاف'); });
dashBtn.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); tryDash(); });
$('pushbtn').addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); tryPush(); });
stage.addEventListener('contextmenu', e => e.preventDefault());

stage.addEventListener('pointerdown', e => {
  if (e.target.closest && e.target.closest('.dashbtn, .ghost, #panel')) return;
  if (game.state === 'spec') { specNext(); return; }
  if (game.state !== 'play') return;
  if (e.pointerType === 'mouse' || e.pointerType === 'pen') {
    mouse.active = true; setMouse(e);
    if (e.button === 2 && NET.on) tryPush(); else if (e.button === 0 || e.button === 2) tryDash();
    return;
  }
  if (e.pointerType !== 'touch' || joy.active) return;
  const r = stage.getBoundingClientRect();
  joy.active = true; joy.id = e.pointerId; joy.ox = e.clientX - r.left; joy.oy = e.clientY - r.top; joy.x = 0; joy.y = 0;
  joyEl.hidden = false; joyEl.style.left = joy.ox + 'px'; joyEl.style.top = joy.oy + 'px'; joyK.style.transform = 'translate(-50%, -50%)';
  try { stage.setPointerCapture(e.pointerId); } catch (er) {}
});
function setMouse(e) {
  const r = stage.getBoundingClientRect();
  mouse.nx = ((e.clientX - r.left) / r.width) * 2 - 1; mouse.ny = -(((e.clientY - r.top) / r.height) * 2 - 1);
}
stage.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse' || e.pointerType === 'pen') { mouse.active = true; setMouse(e); return; }
  if (!joy.active || e.pointerId !== joy.id) return;
  const r = stage.getBoundingClientRect();
  let dx = (e.clientX - r.left - joy.ox) / 52, dy = (e.clientY - r.top - joy.oy) / 52, l = Math.hypot(dx, dy);
  if (l > 1) { dx /= l; dy /= l; }
  joy.x = dx; joy.y = dy;
  joyK.style.transform = 'translate(calc(-50% + ' + (dx * 52).toFixed(1) + 'px), calc(-50% + ' + (dy * 52).toFixed(1) + 'px))';
});
stage.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') mouse.active = false; });
const endJoy = e => { if (joy.active && e.pointerId === joy.id) { joy.active = false; joy.x = 0; joy.y = 0; joyEl.hidden = true; } };
stage.addEventListener('pointerup', endJoy);
stage.addEventListener('pointercancel', endJoy);

if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
window.addEventListener('resize', resize);

/* ---------- Loop ---------- */
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now; if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
  if (NET.on && NET.phase !== 'lobby') updateMP(dt, now);
  else if (game.state === 'play') updatePlay(dt, now);
  else if (game.state === 'dying') updateDying(dt);
  else if (game.state === 'menu') { updateWorld(dt); L.r = 190 * (1 + (RM ? 0 : 0.025 * Math.sin(now * 0.013))); L.pulse = 0; L.prox = 0; dread.style.opacity = '0'; }
  else if (game.state === 'dead') { updateWorld(dt); L.r = 14; dread.style.opacity = '0'; }
  if (game.state === 'play' || game.state === 'menu' || game.state === 'dying' || game.state === 'spec') Snd.ambient(dt, game.state === 'play' ? L.prox : 0);
  render(now, dt);
  requestAnimationFrame(frame);
}

P = newPlayer();
let ok = false;
try { if (typeof THREE !== 'undefined') { init3D(); ok = true; } } catch (e) { ok = false; }
resize();
if (!ok) {
  panel.hidden = false; panel.dir = 'rtl';
  card.innerHTML = '<h1 class="title small">VOID</h1><p class="lede">تعذّر تشغيل العرض ثلاثي الأبعاد في هذا المتصفح. جرّب متصفحًا يدعم WebGL.</p>';
} else {
  setBestHud();
  if (MP_ENABLED && /[?&]room=/.test(location.search)) showPanel('mpjoin'); else showPanel('menu');
  requestAnimationFrame(frame);
}

if (window.__VOIDTEST) window.__VOIDTEST({ game, startGame, frame, keys, MODES, setMode, mouse, tryDash, voids: () => voids, player: () => P, setD: m => setMode(m) });
})();
</script>
